plugins {
    id "com.android.application"
}

android {
    namespace "io.github.codex.zeehospeed"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.codex.zeehospeed"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // A debug key keeps the delivered module directly installable for
            // local LSPosed testing; users can re-sign it for distribution.
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    compileOnly "de.robv.android.xposed:api:82"
}
